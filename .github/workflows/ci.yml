name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Clippy fast profile
        run: cargo clippy --all-targets --no-default-features --bin hincyray -- -D warnings
      - name: Clippy full profile
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Frontend contract
        run: python3 scripts/frontend-contract-test.py
      - name: Installer lifecycle contract
        run: python3 scripts/installer-lifecycle-contract-test.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:browser
